<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nimbus Radar has moved</title>
<meta http-equiv="refresh" content="0; url=/radar/">
<style>
  :root{--bg:#eef1f4;--fg:#14202b;--accent:#0d7f8f;color-scheme:light}
  @media (prefers-color-scheme: dark){:root{--bg:#0c1319;--fg:#e3eaf0;--accent:#3cc3d3;color-scheme:dark}}
  body{margin:0;padding:32px 16px;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent)}
</style>
</head>
<body>
<p>Nimbus Radar has moved to <a href="/radar/">bobbyee358-dev.github.io/radar/</a>.</p>
<script>
// Remove the old app's offline helper so this address stops serving the old copy, then forward.
(async () => {
  try {
    if ("serviceWorker" in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(r => r.scope.includes("/Nimbus/")).map(r => r.unregister()));
    }
  } catch (e) {}
  location.replace("/radar/");
})();
</script>
</body>
</html>
